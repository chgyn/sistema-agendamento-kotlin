ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        host = "0.0.0.0"
    }
    application {
        modules = [ com.barbershop.ApplicationKt.module ]
    }
}

jwt {
    secret = "barbershop-ultra-secure-jwt-secret-key-2026-production"
    secret = ${?JWT_SECRET}
    issuer = "https://barbershop.local"
    issuer = ${?JWT_ISSUER}
    audience = "barbershop-users"
    audience = ${?JWT_AUDIENCE}
    realm = "BarbershopRealm"
    realm = ${?JWT_REALM}
}

database {
    url = "jdbc:postgresql://localhost:5432/barbershop_db"
    url = ${?DATABASE_URL}
    user = "barber_user"
    user = ${?DATABASE_USER}
    password = "barber_pass123"
    password = ${?DATABASE_PASSWORD}
    maxPoolSize = 10
}

redis {
    host = "localhost"
    host = ${?REDIS_HOST}
    port = 6379
    port = ${?REDIS_PORT}
}
